# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Font
# font_family JetBrainsMono Nerd Font
# font_size 12

# Window padding
# window_padding_width 14

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes

font_family Monaco
undercurl_style thin-sparse
cursor_shape beam
cursor_shape_unfocused beam
copy_on_select yes
background_image ~/.config/kitty/testo.png
background_opacity 1
background_image_layout scaled
foreground #FF0033
selection_foreground #FF0033
background_image_linear yes
background_tint 0.8
background #000000
dim_opacity 0.4

# Readability: heavier, higher-contrast glyph rendering and a slightly larger size
font_size 10.5
text_composition_strategy 1.4 25

# Agent / Claude Code windows (org.omarchy.agent, org.omarchy.claude) get no background image
geninclude no-bg-for-agents.sh

# Claude Code diff highlights (marker color from ~/.claude/themes/teto.json) drawn fully transparent
transparent_background_colors #2e7d33@0.2 #c62829@0.2 #43a049@0.35 #e53937@0.35
