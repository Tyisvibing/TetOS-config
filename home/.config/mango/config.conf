bind=SUPER+SHIFT+ALT,Right,tagmon,right

# --- your apps ---
bind=SUPER+CTRL,c,spawn,code
bind=SUPER+SHIFT,d,spawn,discord
bind=SUPER+SHIFT,o,spawn,obsidian
bind=SUPER+SHIFT,w,spawn,omawrite
bind=SUPER+SHIFT,q,spawn,omacalc
