# ======================================================================
# Ty's binds: mirrors the Omarchy / Hyprland setup (~/.config/hypr/bindings.lua)
# Super+K lists them all. Super+Escape logs out (Mango's own quit).
# ======================================================================

# --- essentials ---
bind=SUPER,Return,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,librewolf
bind=SUPER+SHIFT,b,spawn,librewolf
bind=SUPER+SHIFT+ALT,b,spawn,librewolf --private-window
bind=SUPER+SHIFT,f,spawn,nautilus --new-window
bind=SUPER+SHIFT,n,spawn,kitty -e nvim
bind=SUPER+ALT,Return,spawn,kitty -e tmux new -A -s main
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER+ALT,space,spawn,rofi -show drun
bind=SUPER,k,spawn_shell,~/.config/mango/keybinds.sh
bind=SUPER,Escape,spawn_shell,~/.config/mango/power.sh
bind=SUPER+SHIFT,r,reload_config

# --- windows ---
bind=SUPER,w,killclient,
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+ALT,f,togglemaximizescreen,
bind=SUPER,t,togglefloating,
bind=SUPER,m,minimized,
bind=SUPER+CTRL,m,restore_minimized
bind=SUPER,o,toggleoverlay,
bind=SUPER,s,toggle_scratchpad
bind=SUPER,l,switch_layout
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=CTRL+ALT,Tab,focusmon,right
bind=CTRL+ALT+SHIFT,Tab,focusmon,left
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-50
bind=SUPER+SHIFT,equal,resizewin,+0,+50
bind=SUPER+SHIFT,BackSpace,togglegaps

# --- workspaces (Mango calls them tags; 1-9 here, Mango has no tag 10) ---
bind=SUPER,code:10,view,1,0
bind=SUPER,code:11,view,2,0
